[project]
name = "mergemind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akshay R", email = "iamakshayr696@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "neatlogs>=1.4.26",
    "openai>=3.27.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
mergemind = "mergemind:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
