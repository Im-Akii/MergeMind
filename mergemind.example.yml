# Copy to .github/mergemind.yml in the target repo.
autonomy: suggest                 # observe | suggest | invite | merge
maintainers: [alice]
escalate_to: [bob]
access:
  mode: collaborator              # collaborator | fork
  permission: push
  ttl: 14d
  checkin_at: 50%
  min_account_age: 30d
  max_active_leases_per_person: 1
pr:
  require_regression_test: true
  test_commands: []               # auto-detected if empty
  allow_out_of_scope: flag        # flag | block
  merge_method: squash
  post_merge_watch: 30m
guard:
  sensitive_paths: [".env*", "**/.env*", "**/*.pem", "**/*.key", "**/secrets/**", "deploy/**", "infra/**"]
  maintainer_channel: null        # e.g. alice/project-mergemind (a private repo)
demo:
  stand_ins: {}
  time_scale: 1.0
